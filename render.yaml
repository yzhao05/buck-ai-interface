services:
  - type: web
    name: buck-lab-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: CORS_ORIGINS
        sync: false
      - key: SOURCE_URL
        sync: false
