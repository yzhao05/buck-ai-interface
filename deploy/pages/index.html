  <style>

    h2 { margin: 12px 0 24px; font-size: 19px; font-weight: 550; }
    p { margin: 10px 0; }
    p[lang="en"] { color: #506569; font-size: 14px; }
    a { display: inline-block; margin-top: 18px; padding: 10px 18px; border-radius: 8px; background: #086a5b; color: white; text-decoration: none; }

    a:focus-visible { outline: 3px solid #163d37; outline-offset: 4px; }

  <main>
    <h1>Buck Lab</h1>
