name: Deploy Buck Lab to ModelScope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/modelscope.yml'
      - 'deploy/modelscope/**'
      - 'backend/**'
      - 'frontend/**'
      - 'examples/**'
      - 'requirements-lock.txt'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-buck-lab
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the GitHub commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare ModelScope build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/app

          git archive "$GITHUB_SHA" -- \
            backend frontend examples requirements-lock.txt \
            LICENSE THIRD_PARTY_NOTICES.md | tar -x -C build/app

          echo 'window.BUCK_CONFIG = { apiBaseUrl: window.location.origin, studioBackend: true, sourceUrl: "https://github.com/${{ github.repository }}" };' > build/app/frontend/config.js

          cp deploy/modelscope/{Dockerfile,studio_start.py} build/app/

          # The report font exceeds the Studio limit of 10 MiB per plain Git blob.
          # Keep all glyphs and verify the original bytes when building the image.
          (
            cd build/app/backend/assets/fonts
            font=BuckReportSans-Regular.ttf
            sha256sum "$font" > "$font.sha256"
            gzip -n -9 "$font"
            # Studio normally routes *.gz through LFS. This small gzip must be a real blob.
            printf '\n%s\n' "$font.gz -filter -diff -merge -text" >> .gitattributes
          )

      - name: Push deployment files to ModelScope
        shell: bash
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MODELSCOPE_TOKEN:-}" || "$MODELSCOPE_TOKEN" =~ [[:space:]] ]]; then
            echo '::error::请在仓库 Actions Secrets 中填写有效的 MODELSCOPE_TOKEN，并去掉空格或换行。'
            exit 1
          fi
          studio_url=https://www.modelscope.cn/studios/yuzhao05/buck-lab.git
          # Authenticate the initial private Git request, including on gateways
          # that reject it before Git can prompt. Do not store credentials in origin.
          basic=$(printf 'oauth2:%s' "$MODELSCOPE_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$basic"
          export MODELSCOPE_GIT_AUTH_HEADER="Authorization: Basic $basic"
          export GIT_TERMINAL_PROMPT=0
          studio_git() {
            git -c credential.helper= -c http.followRedirects=false \
              --config-env="http.${studio_url}.extraHeader=MODELSCOPE_GIT_AUTH_HEADER" "$@"
          }
          if ! GIT_LFS_SKIP_SMUDGE=1 studio_git clone --depth 1 --branch master "$studio_url" studio; then
            echo '::error::无法读取私有创空间。若上方为 Authentication failed，请更新仓库 Actions Secret MODELSCOPE_TOKEN，并确认令牌所属账号可以访问 yuzhao05/buck-lab。'
            exit 1
          fi
          cd studio
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Replace only application-owned paths; keep the Studio README and metadata.
          git rm -rq --ignore-unmatch -- backend frontend examples buck-lab.tar.gz
          cp -a ../build/app/. .
          files=(backend frontend examples requirements-lock.txt LICENSE THIRD_PARTY_NOTICES.md Dockerfile studio_start.py)
          git add -f -- "${files[@]}"

          # Inspect Git blobs as the builder sees them, without LFS smudging.
          snapshot=$(mktemp -d)
          git archive "$(git write-tree)" -- "${files[@]}" | tar -x -C "$snapshot"
          diff -qr ../build/app "$snapshot"
          python - "$snapshot" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for file in root.rglob("*"):
              if file.is_file() and file.stat().st_size > 10 * 1024 * 1024:
                  raise SystemExit(f"File exceeds ModelScope's 10 MiB Git blob limit: {file.relative_to(root)}")
          PY
          for file in requirements-lock.txt backend/main.py frontend/index.html examples/plecs_buck_case16a.csv studio_start.py Dockerfile; do
            test -s "$snapshot/$file"
          done
          if grep -rIlFx 'version https://git-lfs.github.com/spec/v1' "$snapshot"; then
            echo "Deployment contains a Git LFS pointer instead of application content." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "魔搭文件已经是当前版本。"
            exit 0
          fi
          git commit -m "Deploy GitHub commit $GITHUB_SHA"
          if ! studio_git push origin HEAD:master; then
            echo '::error::已读取创空间，但推送失败。若上方为权限错误，请确认令牌所属账号有该创空间的写权限。'
            exit 1
          fi
