name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conversation metadata and frontend syntax
        run: |
          node tests/check-search-metadata.cjs
          for file in frontend/*.js tests/*.cjs; do node --check "$file"; done
